# Solo para desarrollo local. Levanta PostgreSQL con el esquema ya creado.
services:
  db:
    image: postgres:16
    container_name: puntopyme-db
    environment:
      POSTGRES_DB: puntopyme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - puntopyme-datos:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  puntopyme-datos:
